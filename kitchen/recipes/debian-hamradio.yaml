# ============================================================================
# Debian Hamradio Pure Blend - Amateur Radio
# ============================================================================
# Version: 1.0.0
#
# Official Debian Hamradio Pure Blend configuration for amateur radio
# operators (hams). Provides tools for logging, data modes, rig control,
# antenna modeling, satellite tracking, and software-defined radio.
#
# Usage:
#   # Install complete Hamradio setup
#   sudo debian-composer --blend=debian-hamradio
#
#   # Install specific focus
#   sudo debian-composer --blend=debian-hamradio --var=ham_focus=hf
#   sudo debian-composer --blend=debian-hamradio --var=ham_focus=sdr
#   sudo debian-composer --blend=debian-hamradio --var=ham_focus=satellite
#
#   # Install with Morse code training
#   sudo debian-composer --blend=debian-hamradio --var=enable_training=true
#
#   # HF station setup
#   sudo debian-composer --blend=debian-hamradio --stack=hf-station
#
# References:
#   - Debian Hamradio: https://blends.debian.org/hamradio/
#   - Debian Hamradio Wiki: https://wiki.debian.org/Hamradio/
# ============================================================================

name: debian-hamradio
version: 1.0.0
description: Debian Hamradio Pure Blend - Amateur radio software
author: Debian Composer Team
license: GPL-2.0+
homepage: https://blends.debian.org/hamradio/
tags: [blend, hamradio, amateur-radio, ham, sdr, radio, logging, morse]
kind: pure blend

# ============================================================================
# METADATA
# ============================================================================
metadata:
  category: radio
  target_audience: [amateur-radio-operators, hams, radio-enthusiasts, sdr-users]
  difficulty: intermediate
  min_ram: 2048
  min_disk: 15
  recommended_disk: 30
  gpu_required: false
  gpu_recommended: false

# ============================================================================
# COMPOSABILITY
# ============================================================================
includes:
  - fragments/base-anchors.yaml
  - fragments/service-templates.yaml

dependencies: []

# ============================================================================
# VARIABLES
# ============================================================================
variables:
  ham_focus:
    type: string
    default: all
    choices: [all, hf, vhf, sdr, satellite, digital, voice, cw]
    description: Primary ham radio focus

  enable_logging:
    type: boolean
    default: true
    description: Enable logging software

  enable_rig_control:
    type: boolean
    default: true
    description: Enable rig control (CAT)

  enable_sdr:
    type: boolean
    default: true
    description: Enable software-defined radio

  enable_digital:
    type: boolean
    default: true
    description: Enable digital modes (FT8, RTTY, PSK31)

  enable_cw:
    type: boolean
    default: true
    description: Enable Morse code tools

  enable_satellite:
    type: boolean
    default: false
    description: Enable satellite operation tools

  enable_training:
    type: boolean
    default: true
    description: Enable license training

# ============================================================================
# CATEGORIES - Using tasksel task package
# ============================================================================
# Note: packages installed via categories based on variable selections
categories:
  # --------------------------------------------------------------------------
  # All Hamradio (via task-hamradio)
  # --------------------------------------------------------------------------
  hamradio/all:
    condition: ham_focus == all
    <<: *service_template
    description: "All amateur radio (via task-hamradio)"
    install:
      packages:
        - *hamradio_all
    verify:
      commands:
        - fldigi --version 2>&1 | head -1
        - rigctl --version 2>&1 | head -1
        - cqrlog --version 2>&1 | head -1
        - gpredict --version 2>&1 | head -1
        - direwolf --version 2>&1 | head -1
        - chirp --version 2>&1 | head -1

  # --------------------------------------------------------------------------
  # Focus-specific (installed via task-hamradio)
  # --------------------------------------------------------------------------
  logging/tools:
    condition: enable_logging == true or ham_focus == all
    <<: *service_template
    description: "Logging (included in task-hamradio)"
    install:
      packages:
        - *hamradio_logging
    verify:
      commands:
        - cqrlog --version 2>&1 | head -1

  rig/control:
    condition: enable_rig_control == true or ham_focus == hf or ham_focus == vhf
    <<: *service_template
    description: "Rig control (included in task-hamradio)"
    install:
      packages:
        - *hamradio_rigcontrol
    configure:
      service:
        name: hamlib
        enable: false
    verify:
      commands:
        - rigctl --version 2>&1 | head -1

  digital/modes:
    condition: enable_digital == true or ham_focus == digital or ham_focus == hf
    <<: *service_template
    description: "Digital modes (included in task-hamradio)"
    install:
      packages:
        - *hamradio_datamodes
    verify:
      commands:
        - fldigi --version 2>&1 | head -1

  cw/tools:
    condition: enable_cw == true or ham_focus == cw
    <<: *service_template
    description: "Morse code (included in task-hamradio)"
    install:
      packages:
        - *hamradio_morse
    verify:
      commands:
        - echo --help 2>&1 | head -1

  antenna/modeling:
    condition: ham_focus == hf or ham_focus == vhf
    <<: *service_template
    description: "Antenna modeling (included in task-hamradio)"
    install:
      packages:
        - *hamradio_antenna
    verify:
      commands:
        - nec2c --help 2>&1 | head -1

  sdr/receivers:
    condition: enable_sdr == true or ham_focus == sdr
    <<: *service_template
    description: "SDR (included in task-hamradio)"
    install:
      packages:
        - *hamradio_sdr
    configure:
      service:
        name: rtl-sdr
        enable: false
    verify:
      commands:
        - gqrx --version 2>&1 | head -1

  packet/modes:
    condition: ham_focus == vhf
    <<: *service_template
    description: "Packet modes (included in task-hamradio)"
    install:
      packages:
        - *hamradio_packetmodes
    verify:
      commands:
        - direwolf --version 2>&1 | head -1

  voice/digital:
    condition: ham_focus == voice or ham_focus == vhf
    <<: *service_template
    description: "Digital voice (included in task-hamradio)"
    install:
      packages:
        - *hamradio_digitalvoice
    configure:
      service:
        name: svxlink
        enable: false
    verify:
      commands:
        - svxlink --version 2>&1 | head -1

  satellite/tracking:
    condition: enable_satellite == true or ham_focus == satellite
    <<: *service_template
    description: "Satellite (included in task-hamradio)"
    install:
      packages:
        - *hamradio_satellite
    verify:
      commands:
        - gpredict --version 2>&1 | head -1

  training/license:
    condition: enable_training == true
    <<: *service_template
    description: "Training (included in task-hamradio)"
    install:
      packages:
        - *hamradio_training
    verify:
      commands:
        - exam --help 2>&1 | head -1

# ============================================================================
# STACKS - Pre-configured setups
# ============================================================================
stacks:
  complete:
    description: "Complete ham radio setup"
    categories:
      - logging/tools
      - rig/control
      - digital/modes
      - digital/weak-signal
      - cw/tools
      - antenna/modeling
      - sdr/receivers
      - sdr/processing
      - packet/modes
      - tools/misc

  hf-station:
    description: "HF station setup"
    categories:
      - logging/tools
      - rig/control
      - digital/modes
      - digital/weak-signal
      - cw/tools
      - cw/training
      - antenna/modeling
      - tools/misc

  vhf-station:
    description: "VHF/UHF station setup"
    categories:
      - logging/tools
      - rig/control
      - voice/digital
      - packet/modes
      - tools/misc

  sdr-setup:
    description: "Software-defined radio setup"
    categories:
      - sdr/receivers
      - sdr/processing
      - sdr/hardware
      - rig/control

  satellite-station:
    description: "Satellite operation setup"
    categories:
      - satellite/tracking
      - rig/control
      - digital/modes
      - logging/tools

  digital-station:
    description: "Digital modes station"
    categories:
      - digital/modes
      - digital/weak-signal
      - digital/psk
      - digital/sstv
      - logging/tools
      - rig/control

  cw-operator:
    description: "CW (Morse code) operator setup"
    categories:
      - cw/tools
      - cw/training
      - rig/control
      - logging/tools
      - training/license

  beginner:
    description: "Beginner ham radio setup"
    categories:
      - training/license
      - cw/training
      - logging/tools
      - rig/control

# ============================================================================
# REQUIREMENTS
# ============================================================================
requirements:
  <<: *req_blend_hamradio

# ============================================================================
# POST-INSTALLATION
# ============================================================================
post_install:
  - "=== Debian Hamradio Installation Complete ==="
  - ""
  - "Configuration Summary:"
  - "  Focus: ${ham_focus}"
  - "  Logging: ${enable_logging}"
  - "  Rig Control: ${enable_rig_control}"
  - "  SDR: ${enable_sdr}"
  - "  Digital: ${enable_digital}"
  - "  CW: ${enable_cw}"
  - "  Satellite: ${enable_satellite}"
  - "  Training: ${enable_training}"
  - ""
  - "Rig Control Setup:"
  - "  1. Configure: /etc/hamlib.conf"
  - "  2. Test: rigctl -m 1 -r /dev/ttyUSB0"
  - "  3. Start: flrig"
  - ""
  - "SDR Setup:"
  - "  1. Install udev rules for SDR device"
  - "  2. Test: rtl_test"
  - "  3. Start: gqrx"
  - ""
  - "Digital Modes:"
  - "  - FT8/JT65: wsjtx"
  - "  - PSK31/RTTY: fldigi"
  - "  - JS8Call: js8call"
  - ""
  - "Resources:"
  - "  - Debian Hamradio: https://blends.debian.org/hamradio/"
  - "  - Hamlib: https://hamlib.github.io/"
  - "  - WSJT-X: https://wsjt.sourceforge.io/"

# ============================================================================
# EXAMPLES
# ============================================================================
examples:
  - title: HF Station
    description: Install HF station setup
    command: sudo debian-composer --blend=debian-hamradio --stack=hf-station --var=ham_focus=hf

  - title: SDR Setup
    description: Install software-defined radio setup
    command: sudo debian-composer --blend=debian-hamradio --stack=sdr-setup --var=ham_focus=sdr --var=enable_sdr=true

  - title: Digital Modes
    description: Install digital modes station
    command: sudo debian-composer --blend=debian-hamradio --stack=digital-station --var=ham_focus=digital --var=enable_digital=true

  - title: Beginner Setup
    description: Install beginner ham radio setup with training
    command: sudo debian-composer --blend=debian-hamradio --stack=beginner --var=enable_training=true
