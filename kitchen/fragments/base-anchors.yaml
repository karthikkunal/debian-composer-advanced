  gpu: true

_req_blend_med: &req_blend_med
  min_ram: 4096
  min_disk: 20
  gpu: false

_req_blend_gis: &req_blend_gis
  min_ram: 8192
  min_disk: 50
  gpu: true

_req_blend_astro: &req_blend_astro
  min_ram: 4096
  min_disk: 30
  gpu: false

_req_blend_bio: &req_blend_bio
  min_ram: 8192
  min_disk: 50
  gpu: true

# ----------------------------------------------------------------------------
# Category Installation Templates
# ----------------------------------------------------------------------------
# Package-only installation
_install_packages_only: &install_packages_only
  packages: []

# Packages + repositories installation
_install_with_repo: &install_with_repo
  packages: []
  repositories: []

# Script-based installation
_install_script: &install_script
  packages: []
  script:
    url: ""
    env: {}

# Docker image installation
_install_docker: &install_docker
  packages: []
  docker:
    image: ""
    pull: true

# ----------------------------------------------------------------------------
# Configuration Templates by Category
# ----------------------------------------------------------------------------
# Nginx configuration template
_cfg_nginx: &cfg_nginx
  service:
    name: nginx
    enable: true
    start: true
  directories:
    config: /etc/nginx
    logs: /var/log/nginx
    www: /var/www/html
  security:
    hide_version: true
    ssl_enabled: true

# Apache configuration template
_cfg_apache: &cfg_apache
  service:
    name: apache2
    enable: true
    start: true
  modules:
    enable: []
  directories:
    config: /etc/apache2
    www: /var/www/html
  security:
    server_tokens: false
    ssl_enabled: true

# MySQL/MariaDB configuration template
_cfg_mysql: &cfg_mysql
  service:
    name: mysql
    enable: true
    start: true
  settings:
    port: 3306
    bind_address: 127.0.0.1
    secure_installation: true
  security:
    root_password_required: true
    remove_anonymous: true
    disallow_root_login_remotely: true
    remove_test_db: true

# PostgreSQL configuration template
_cfg_postgresql: &cfg_postgresql
  service:
    name: postgresql
    enable: true
    start: true
  settings:
    port: 5432
    listen_addresses: localhost
  authentication:
    method: peer

# Redis configuration template
_cfg_redis: &cfg_redis
  service:
    name: redis-server
    enable: true
    start: true
  settings:
    port: 6379
    bind: 127.0.0.1
  persistence:
    rdb: true
    aof: false

# Docker daemon configuration template
_cfg_docker: &cfg_docker
  service:
    name: docker
    enable: true
    start: true
  user_groups:
    - docker
  daemon:
    log_driver: json-file
    log_opts:
      max-size: 10m
      max-file: "3"
    storage_driver: overlay2
    features:
      buildkit: true

# Ollama configuration template
_cfg_ollama: &cfg_ollama
  service:
    name: ollama
    enable: true
    start: true
  validation:
    - type: service
      name: ollama
      state: active
    - type: port
      port: 11434
      protocol: tcp

# ----------------------------------------------------------------------------
# Verification Templates by Category
# ----------------------------------------------------------------------------
# Nginx verification
_verify_nginx: &verify_nginx
  commands:
    - nginx -v
  services_running:
    - nginx
  ports_listening:
    - 80
    - 443

# Apache verification
_verify_apache: &verify_apache
  commands:
    - apache2 -v
    - apachectl -M | grep -E "rewrite|ssl|headers"
  services_running:
    - apache2
  ports_listening:
    - 80
    - 443

# MySQL verification
_verify_mysql: &verify_mysql
  commands:
    - mysql --version
    - mysqladmin -u root status
  services_running:
    - mysql
  ports_listening:
    - 3306

# PostgreSQL verification
_verify_postgresql: &verify_postgresql
  commands:
    - psql --version
    - pg_isready
  services_running:
    - postgresql
  ports_listening:
    - 5432

# Redis verification
_verify_redis: &verify_redis
  commands:
    - redis-server --version
    - redis-cli ping
  services_running:
    - redis-server
  ports_listening:
    - 6379

# Docker verification
_verify_docker: &verify_docker
  commands:
    - docker --version
    - docker compose version
  services_running:
    - docker
  files_exist:
    - /etc/docker/daemon.json

# Ollama verification
_verify_ollama: &verify_ollama
  commands:
    - ollama --version
  services_running:
    - ollama
  ports_listening:
    - 11434

# ----------------------------------------------------------------------------
# Desktop Environment Hooks (templates in service-templates.yaml)
# ----------------------------------------------------------------------------
# Note: Desktop package lists are in fragments/service-templates.yaml
# because they're used by desktop service templates

_desktop_lightdm_hooks: &desktop_lightdm_hooks
  configure:
    hooks:
      pre_configure:
        - type: service
          service: lightdm
          action: enable
          description: "Enable LightDM display manager"
      post_configure:
        - type: command
          command: "update-desktop-database 2>/dev/null || true"
          description: "Update desktop database"

_desktop_gdm_hooks: &desktop_gdm_hooks
  configure:
    hooks:
      pre_configure:
        - type: service
          service: gdm3
          action: enable
          description: "Enable GDM3 display manager"
      post_configure:
        - type: command
          command: "update-desktop-database 2>/dev/null || true"
          description: "Update desktop database"

_desktop_sddm_hooks: &desktop_sddm_hooks
  configure:
    hooks:
      pre_configure:
        - type: service
          service: sddm
          action: enable
          description: "Enable SDDM display manager"
      post_configure:
        - type: command
          command: "update-desktop-database 2>/dev/null || true"
          description: "Update desktop database"

