# ============================================================================
# Base Anchors - Shared YAML Anchors for DRY Configuration
# ============================================================================
# Usage: Include this file or copy anchors to your recipes
# Example: packages: *base_packages
# ============================================================================

# ----------------------------------------------------------------------------
# Common Package Lists
# ----------------------------------------------------------------------------
# Minimal base packages (git, curl, wget, ca-certificates, gnupg)
_base_packages: &base_packages [git, curl, wget, ca-certificates, gnupg]

# Development essentials (base + build tools)
_dev_packages: &dev_packages [git, curl, wget, ca-certificates, gnupg, build-essential, make]

# Python development packages
_python_base: &python_base [python3, python3-pip, python3-venv]

# Python development packages (with dev headers)
_python_dev: &python_dev [python3, python3-pip, python3-venv, python3-dev]

# Web server prerequisites
_web_prerequisites: &web_prerequisites [curl, wget, git, ufw, ca-certificates, gnupg]

# Database client packages
_db_client: &db_client [curl, wget, ca-certificates, gnupg]

# Container/DevOps prerequisites
_container_prerequisites: &container_prerequisites [apt-transport-https, ca-certificates, curl, gnupg, lsb-release, git]

# AI/ML prerequisites
_ai_prerequisites: &ai_prerequisites [git, curl, wget, python3, python3-pip, python3-venv]

# ----------------------------------------------------------------------------
# Service Configuration Templates
# ----------------------------------------------------------------------------
# Default service configuration pattern
_service_defaults: &service_defaults
  enable: true
  start: true

# Service with name template
_service_with_name: &service_with_name
  name: ""  # Override with actual service name
  enable: true
  start: true

# ----------------------------------------------------------------------------
# Verification Templates
# ----------------------------------------------------------------------------
# Basic command verification
_verify_commands_only: &verify_commands_only
  commands: []

# Service verification pattern
_verify_service: &verify_service
  services_running: []

# Port verification pattern
_verify_ports: &verify_ports
  ports_listening: []

# File existence verification
_verify_files: &verify_files
  files_exist: []

# Combined service + port verification
_verify_service_and_ports: &verify_service_and_ports
  services_running: []
  ports_listening: []

# Full verification template (commands + service + ports)
_verify_full: &verify_full
  commands: []
  services_running: []
  ports_listening: []

# ----------------------------------------------------------------------------
# Directory Configuration Templates
# ----------------------------------------------------------------------------
# Standard service directories
_dirs_standard: &dirs_standard
  config: ""  # Override with /etc/<service>
  logs: ""    # Override with /var/log/<service>
  data: ""    # Override with /var/lib/<service>

# Web server directories
_dirs_web: &dirs_web
  config: /etc/nginx
  logs: /var/log/nginx
  www: /var/www/html

# Database directories
_dirs_db: &dirs_db
  config: /etc/mysql
  data: /var/lib/mysql
  logs: /var/log/mysql

# ----------------------------------------------------------------------------
# Security Configuration Templates
# ----------------------------------------------------------------------------
# Basic security headers
_security_headers: &security_headers
  - "X-Frame-Options: SAMEORIGIN"
  - "X-Content-Type-Options: nosniff"
  - "X-XSS-Protection: 1; mode=block"

# SSL/TLS defaults
_ssl_defaults: &ssl_defaults
  enabled: true
  redirect: true
  min_version: "TLSv1.2"

# ----------------------------------------------------------------------------
# Repository Configuration Templates
# ----------------------------------------------------------------------------
# Standard repository pattern with GPG key
_repo_with_key: &repo_with_key
  name: ""  # Override with repo name
  key: ""   # Override with key URL
  keyring: ""  # Override with keyring path
  url: ""   # Override with repository URL

# ----------------------------------------------------------------------------
# Hook Templates
# ----------------------------------------------------------------------------
# Pre-install hook pattern
_hook_pre_install: &hook_pre_install
  - type: apt
    action: update

# Post-install hook pattern
_hook_post_install: &hook_post_install
  - type: command
    command: "echo 'Installation complete'"

# Pre-configure hook
_hook_pre_configure: &hook_pre_configure
  - type: wait
    seconds: 2

# Post-configure hook
_hook_post_configure: &hook_post_configure
  - type: command
    command: "echo 'Configuration complete'"

# ----------------------------------------------------------------------------
# Requirements Templates
# ----------------------------------------------------------------------------
# Minimal requirements
_req_minimal: &req_minimal
  min_ram: 512
  min_disk: 2
  gpu: false

# Standard requirements
_req_standard: &req_standard
  min_ram: 2048
  min_disk: 10
  gpu: false

# High requirements (for heavy tools)
_req_heavy: &req_heavy
  min_ram: 8192
  min_disk: 20
  gpu: true

# Container requirements
_req_container: &req_container
  min_ram: 4096
  min_disk: 20
  gpu: false
  virtualization: true

# ----------------------------------------------------------------------------
# Debian Pure Blend Requirements Templates
# ----------------------------------------------------------------------------
_req_blend_edu: &req_blend_edu
  min_ram: 4096
  min_disk: 30
  gpu: false

_req_blend_science: &req_blend_science
  min_ram: 8192
