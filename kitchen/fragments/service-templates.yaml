# ============================================================================
# Service Templates - Reusable Category Templates with Merge Keys
# ============================================================================
# Usage: Use merge key (<<:) to inherit template, then override specific values
# Example:
#   categories:
#     nginx:
#       <<: *service_template
#       install:
#         packages: [nginx]
#       configure:
#         service:
#           name: nginx
# ============================================================================

# ----------------------------------------------------------------------------
# Desktop Environment Package Lists (needed before templates)
# ----------------------------------------------------------------------------
_desktop_base: &desktop_base
  - xorg
  - xinit
  - fonts-liberation
  - fonts-dejavu-core
  - hicolor-icon-theme
  - adwaita-icon-theme

_desktop_gnome: &desktop_gnome
  - gnome
  - gnome-tweaks
  - gnome-shell-extensions
  - chrome-gnome-shell

_desktop_kde: &desktop_kde
  - kde-plasma-desktop
  - kde-applications
  - sddm

_desktop_xfce: &desktop_xfce
  - xfce4
  - xfce4-goodies

_desktop_mate: &desktop_mate
  - mate-desktop-environment
  - mate-desktop-environment-extras

_desktop_cinnamon: &desktop_cinnamon
  - cinnamon
  - cinnamon-core

_desktop_lxqt: &desktop_lxqt
  - lxqt
  - lxqt-panel

_desktop_budgie: &desktop_budgie
  - ubuntu-budgie-desktop
  - budgie-desktop

_desktop_i3: &desktop_i3
  - i3
  - i3status
  - i3lock
  - dmenu
  - dunst

_desktop_sway: &desktop_sway
  - sway
  - swaybg
  - swaylock
  - swayidle
  - waybar
  - wofi

_desktop_hyprland: &desktop_hyprland
  - hyprland
  - hyprpaper
  - hyprlock
  - hypridle
  - hyprcursor
  - waybar
  - wofi
  - mako
  - grim
  - slurp
  - swappy
  - wl-clipboard
  - pavucontrol
  - sddm

# ----------------------------------------------------------------------------
# Base Service Template - Foundation for all service categories
# ----------------------------------------------------------------------------
.service_template: &service_template
  install:
    packages: []
    repositories: []
    scripts: []
  configure:
    service:
      name: ""
      enable: true
      start: true
    directories:
      config: ""
      data: ""
      logs: ""
    settings: {}
    security: {}
    hooks:
      pre_install: []
      post_install: []
      pre_configure: []
      post_configure: []
  verify:
    commands: []
    services_running: []
    ports_listening: []
    files_exist: []

# ----------------------------------------------------------------------------
# Web Server Template - For nginx, apache, caddy, etc.
# ----------------------------------------------------------------------------
.web_server_template: &web_server_template
  <<: *service_template
  install:
    packages: []
    repositories: []
  configure:
    service:
      name: ""
      enable: true
      start: true
    directories:
      config: ""
      logs: ""
      www: /var/www/html
    security:
      hide_version: true
      ssl_enabled: true
  verify:
    commands: []
    services_running: []
    ports_listening:
      - 80
      - 443
    files_exist: []

# ----------------------------------------------------------------------------
# Database Server Template - For MySQL, PostgreSQL, MariaDB, etc.
# ----------------------------------------------------------------------------
.database_server_template: &database_server_template
  <<: *service_template
  install:
    packages: []
    repositories: []
  configure:
    service:
      name: ""
      enable: true
      start: true
    settings:
      port: 0
      bind_address: 127.0.0.1
      secure_installation: true
    security: {}
  verify:
    commands: []
    services_running: []
    ports_listening: []
    files_exist: []

# ----------------------------------------------------------------------------
# Cache Server Template - For Redis, Memcached, etc.
# ----------------------------------------------------------------------------
.cache_server_template: &cache_server_template
  <<: *service_template
  install:
    packages: []
  configure:
    service:
      name: ""
      enable: true
      start: true
    settings:
      port: 0
      bind: 127.0.0.1
    persistence: {}
  verify:
    commands: []
    services_running: []
    ports_listening: []
    files_exist: []

# ----------------------------------------------------------------------------
