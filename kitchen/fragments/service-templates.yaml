# ============================================================================
# Pre-configured Service Instances (Ready to use with merge key)
# ============================================================================

# Nginx - Ready to use
.nginx_service: &nginx_service
  <<: *web_server_template
  install:
    packages:
      - nginx
      - nginx-extras
  configure:
    service:
      name: nginx
    directories:
      config: /etc/nginx
      logs: /var/log/nginx
      www: /var/www/html
  verify:
    commands:
      - nginx -v
    services_running:
      - nginx
    ports_listening:
      - 80
      - 443

# Apache - Ready to use
.apache_service: &apache_service
  <<: *web_server_template
  install:
    packages:
      - apache2
      - apache2-utils
  configure:
    service:
      name: apache2
    directories:
      config: /etc/apache2
      www: /var/www/html
    modules:
      enable:
        - rewrite
        - ssl
        - headers
  verify:
    commands:
      - apache2 -v
    services_running:
      - apache2
    ports_listening:
      - 80
      - 443

# MySQL - Ready to use
.mysql_service: &mysql_service
  <<: *database_server_template
  install:
    packages:
      - mysql-server
      - mysql-client
      - python3-mysql.connector
  configure:
    service:
      name: mysql
    settings:
      port: 3306
      bind_address: 127.0.0.1
      secure_installation: true
    security:
      root_password_required: true
      remove_anonymous: true
      disallow_root_login_remotely: true
      remove_test_db: true
  verify:
    commands:
      - mysql --version
      - mysqladmin -u root status
    services_running:
      - mysql
    ports_listening:
      - 3306

# PostgreSQL - Ready to use
.postgresql_service: &postgresql_service
  <<: *database_server_template
  install:
    packages:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
  configure:
    service:
      name: postgresql
    settings:
      port: 5432
      listen_addresses: localhost
    authentication:
      method: peer
  verify:
    commands:
      - psql --version
      - pg_isready
    services_running:
      - postgresql
    ports_listening:
      - 5432

# Redis - Ready to use
.redis_service: &redis_service
  <<: *cache_server_template
  install:
    packages:
      - redis-server
      - redis-tools
  configure:
    service:
      name: redis-server
    settings:
      port: 6379
      bind: 127.0.0.1
    persistence:
      rdb: true
      aof: false
  verify:
    commands:
      - redis-server --version
      - redis-cli ping
    services_running:
      - redis-server
    ports_listening:
      - 6379

# Docker - Ready to use
.docker_service: &docker_service
  <<: *container_service_template
  install:
    packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
  configure:
    service:
      name: docker
    user_groups:
      - docker
    daemon:
      log_driver: json-file
      log_opts:
        max-size: 10m
        max-file: "3"
      storage_driver: overlay2
      features:
        buildkit: true
  verify:
    commands:
      - docker --version
      - docker compose version
    services_running:
      - docker
    files_exist:
      - /etc/docker/daemon.json

# Ollama - Ready to use
.ollama_service: &ollama_service
  <<: *api_service_template
  install:
    packages:
      - ollama
    repositories:
      - name: ollama
        url: "deb https://ollama.com/debian stable main"
        key: https://ollama.com/public-key.asc
  configure:
    service:
      name: ollama
    validation:
      - type: service
        name: ollama
        state: active
      - type: port
        port: 11434
        protocol: tcp
  verify:
    commands:
      - ollama --version
    services_running:
      - ollama
    ports_listening:
      - 11434

# ----------------------------------------------------------------------------
# Desktop Environment Templates
# ----------------------------------------------------------------------------
.desktop_base_template: &desktop_base_template
  install:
    packages: *desktop_base
  configure:
    display_manager:
      service: lightdm
      enable: true
    hooks:
      post_configure:
        - type: command
          command: "update-desktop-database 2>/dev/null || true"
          description: "Update desktop database"
  verify:
    commands:
      - "echo 'Desktop environment installed'"
    files_exist:
      - /usr/share/xsessions

.desktop_gnome_service: &desktop_gnome_service
  <<: *desktop_base_template
  install:
    packages: *desktop_gnome
  configure:
    display_manager:
      service: gdm3
      enable: true
    hooks:
      post_configure:
        - type: command
          command: "update-desktop-database 2>/dev/null || true"
  verify:
    commands:
      - "echo 'GNOME installed'"
    files_exist:
      - /usr/share/xsessions/gnome.desktop

