# ============================================================================
# MATE Desktop Component
# ============================================================================
# MATE - Traditional GNOME 2 fork with modern updates
#
# Reusable component for any recipe needing MATE desktop
#
# Usage:
#   sudo debian-composer --recipe=my-recipe --component=mate-desktop

name: mate-desktop
version: 1.0.0
description: MATE desktop - Traditional GNOME 2 fork with modern updates
author: Debian Composer Team
license: MIT
tags: [desktop, mate, traditional, gui]

# ============================================================================
# COMPOSABILITY
# ============================================================================
includes:
  - fragments/base-anchors.yaml
  - fragments/service-templates.yaml

# ============================================================================
# REQUIREMENTS
# ============================================================================
requires:
  components:
    - base

# ============================================================================
# INSTALL
# ============================================================================
install:
  packages: *desktop_mate

# ============================================================================
# CONFIGURE
# ============================================================================
configure:
  display_manager:
    service: lightdm
    enable: true
  hooks:
    post_configure:
      - type: command
        command: "update-desktop-database 2>/dev/null || true"
        description: "Update desktop database"

# ============================================================================
# VERIFY
# ============================================================================
verify:
  commands:
    - mate-session --version
  files_exist:
    - /usr/share/xsessions/mate.desktop

# ============================================================================
# REQUIREMENTS
# ============================================================================
requirements:
  <<: *req_minimal
  min_ram: 2048
  min_disk: 10

# ============================================================================
# POST-INSTALL
# ============================================================================
post_install:
  - "MATE: Select MATE session at login"
  - "Display Manager: LightDM enabled"
  - "Traditional: Classic GNOME 2 experience"
  - "Customize: Use MATE Control Center"
