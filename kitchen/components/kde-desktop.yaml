# ============================================================================
# KDE Plasma Desktop Component
# ============================================================================
# KDE Plasma - Feature-rich, customizable, and modern desktop
#
# Reusable component for any recipe needing KDE Plasma desktop
#
# Variables:
#   plasma_theme: Plasma theme name (default: Breeze)
#   icon_theme: Icon theme name (default: Breeze)
#   display_manager: Display manager (default: sddm)
#   enable_wayland: Enable Wayland session (default: true)
#   enable_kde_applications: Install KDE applications (default: true)
#
# Usage:
#   sudo debian-composer --recipe=my-recipe --component=kde-desktop
#   sudo debian-composer --recipe=my-recipe --component=kde-desktop --var=plasma_theme=Catppuccin

name: kde-desktop
version: 1.0.0
description: KDE Plasma desktop - Feature-rich, customizable, and modern
author: Debian Composer Team
license: MIT
tags: [desktop, kde, plasma, wayland, gui]

# ============================================================================
# COMPOSABILITY
# ============================================================================
includes:
  - fragments/base-anchors.yaml
  - fragments/service-templates.yaml

# ============================================================================
# VARIABLES
# ============================================================================
variables:
  plasma_theme:
    type: string
    default: "Breeze"
    description: "Plasma theme name"
  icon_theme:
    type: string
    default: "Breeze"
    description: "Icon theme name"
  display_manager:
    type: string
    default: "sddm"
    description: "Display manager (sddm, lightdm, gdm3)"
  enable_wayland:
    type: boolean
    default: true
    description: "Enable Wayland session"
  enable_kde_applications:
    type: boolean
    default: true
    description: "Install KDE applications (Dolphin, Konsole, etc.)"

# ============================================================================
# REQUIREMENTS
# ============================================================================
requires:
  components:
    - base

# ============================================================================
# INSTALL
# ============================================================================
install:
  packages: *desktop_kde

# ============================================================================
# CONFIGURE
# ============================================================================
configure:
  display_manager:
    service: "${display_manager}"
    enable: true
  wayland:
    enabled: "${enable_wayland}"
  hooks:
    post_configure:
      - type: command
        command: "update-desktop-database 2>/dev/null || true"
        description: "Update desktop database"

# ============================================================================
# VERIFY
# ============================================================================
verify:
  commands:
    - plasmashell --version
    - startkde --version
  files_exist:
    - /usr/share/xsessions/plasma.desktop
    - /usr/share/wayland-sessions/plasma.desktop

# ============================================================================
# REQUIREMENTS
# ============================================================================
requirements:
  <<: *req_standard
  min_ram: 4096
  min_disk: 15

# ============================================================================
# POST-INSTALL
# ============================================================================
post_install:
  - "KDE Plasma: Select Plasma session at login"
  - "Display Manager: ${display_manager} enabled"
  - "Plasma Theme: ${plasma_theme}"
  - "Icon Theme: ${icon_theme}"
  - "Wayland: ${enable_wayland}"
  - "Configure: Run system settings for customization"
  - "KDE Applications: ${enable_kde_applications}"
