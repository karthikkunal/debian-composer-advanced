# ============================================================================
# LXQt Desktop Component
# ============================================================================
# LXQt - Lightweight Qt desktop environment
#
# Reusable component for any recipe needing LXQt desktop
#
# Usage:
#   sudo debian-composer --recipe=my-recipe --component=lxqt-desktop

name: lxqt-desktop
version: 1.0.0
description: LXQt desktop - Lightweight Qt desktop environment
author: Debian Composer Team
license: MIT
tags: [desktop, lxqt, lightweight, qt]

# ============================================================================
# COMPOSABILITY
# ============================================================================
includes:
  - fragments/base-anchors.yaml
  - fragments/service-templates.yaml

# ============================================================================
# REQUIREMENTS
# ============================================================================
requires:
  components:
    - base

# ============================================================================
# INSTALL
# ============================================================================
install:
  packages: *desktop_lxqt

# ============================================================================
# CONFIGURE
# ============================================================================
configure:
  display_manager:
    service: lightdm
    enable: true
  hooks:
    post_configure:
      - type: command
        command: "update-desktop-database 2>/dev/null || true"
        description: "Update desktop database"

# ============================================================================
# VERIFY
# ============================================================================
verify:
  commands:
    - lxqt-session --version
  files_exist:
    - /usr/share/xsessions/lxqt.desktop

# ============================================================================
# REQUIREMENTS
# ============================================================================
requirements:
  <<: *req_minimal
  min_ram: 512
  min_disk: 5

# ============================================================================
# POST-INSTALL
# ============================================================================
post_install:
  - "LXQt: Select LXQt session at login"
  - "Display Manager: LightDM enabled"
  - "Lightweight: Most lightweight Qt desktop"
  - "Customize: Use LXQt Settings"
