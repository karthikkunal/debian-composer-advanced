# Debian Composer Go - GitLab CI/CD Pipeline
# ============================================================================
# Optimized for Go builds with nFPM packaging
#
# Stages: lint → test → build → package → deploy
# ============================================================================

variables:
  GO_VERSION: "1.26"
  CGO_ENABLED: "0"
  DEBIAN_VERSION: "bookworm"
  NFPM_VERSION: "2.45.0"

default:
  interruptible: true

stages:
  - lint
  - test
  - build
  - package
  - deploy

# ============================================================================
# LINT STAGE
# ============================================================================

golangci-lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run --timeout 5m ./...
  allow_failure: false

go-vet:
  stage: lint
  image: golang:${GO_VERSION}-alpine
  script:
    - go vet ./...

go-fmt:
  stage: lint
  image: golang:${GO_VERSION}-alpine
  script:
    - go fmt ./...
    - test -z "$(gofmt -l .)" || (echo "gofmt failed"; gofmt -l .; exit 1)

yaml-lint:
  stage: lint
  image: python:3.12-alpine
  before_script:
    - pip install yamllint --quiet
  script:
    - yamllint -d relaxed kitchen/

# ============================================================================
# TEST STAGE
# ============================================================================

unit-tests:
  stage: test
  image: golang:${GO_VERSION}-alpine
  variables:
    GOFLAGS: "-race"
  script:
    - go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/...
    - go tool cover -func=coverage.out -o=coverage.txt
    - go tool cover -html=coverage.out -o=coverage.html
  artifacts:
    paths:
      - coverage.txt
      - coverage.html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'

integration-tests:
  stage: test
  image: golang:${GO_VERSION}-alpine
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - go test -v -tags=integration ./tests/...
  allow_failure: true

recipe-validation:
  stage: test
  image: golang:${GO_VERSION}-alpine
  script:
    - go build -o debian-composer ./cmd/debian-composer
    - ./bin/debian-composer-go validate-all
  allow_failure: true

# ============================================================================
# BUILD STAGE
# ============================================================================

build-binary:
  stage: build
  image: golang:${GO_VERSION}-alpine
  variables:
    GOOS: "linux"
    GOARCH: "amd64"
  script:
    - apk add --no-cache make git
    - make build
    - chmod +x bin/debian-composer-go
    - file bin/debian-composer-go
    - bin/debian-composer-go --version
  artifacts:
    paths:
      - bin/debian-composer-go
    expire_in: 1 week

build-multiarch:
  stage: build
  image: golang:${GO_VERSION}-alpine
  script:
    - apk add --no-cache make git
    - GOOS=linux GOARCH=amd64 make build
    - mv bin/debian-composer-go bin/debian-composer-go-amd64
    - GOOS=linux GOARCH=arm64 make build
    - mv bin/debian-composer-go bin/debian-composer-go-arm64
  artifacts:
    paths:
      - bin/debian-composer-go-amd64
      - bin/debian-composer-go-arm64
  allow_failure: true

# ============================================================================
# PACKAGE STAGE (using nFPM)
# ============================================================================

package-deb-nfpm:
  stage: package
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git make dpkg
    - go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}
  script:
    - export VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
    - export GOARCH=amd64
    - make nfpm-package
    - ls -lh dist/
    - echo "=== Package Info ==="
    - dpkg-deb -I dist/debian-composer_*.deb
    - echo "=== Package Contents (first 20 lines) ==="
    - dpkg -c dist/debian-composer_*.deb | head -20
  artifacts:
    paths:
      - dist/*.deb
    expire_in: 1 month
    name: "debian-composer-debs"
  only:
    - tags
    - main

package-multiarch-nfpm:
  stage: package
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git make dpkg
    - go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}
  script:
    - export VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
    # Build for amd64
    - GOOS=linux GOARCH=amd64 make build
    - nfpm package --packager deb --target dist/debian-composer_${VERSION}_linux_amd64.deb
    - dpkg-deb -I dist/debian-composer_${VERSION}_linux_amd64.deb
    # Build for arm64
    - GOOS=linux GOARCH=arm64 make build
    - nfpm package --packager deb --target dist/debian-composer_${VERSION}_linux_arm64.deb
    - dpkg-deb -I dist/debian-composer_${VERSION}_linux_arm64.deb
  artifacts:
    paths:
      - dist/*.deb
    expire_in: 1 month
    name: "debian-composer-multiarch-debs"
  only:
    - tags
  allow_failure: true

# Optional: Build RPM packages for cross-distro support
package-rpm-nfpm:
  stage: package
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git make rpm
    - go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}
  script:
    - export VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
    - GOOS=linux GOARCH=amd64 make build
    - nfpm package --packager rpm --target dist/debian-composer-${VERSION}-1.x86_64.rpm
    - rpm -qip dist/debian-composer-${VERSION}-1.x86_64.rpm || true
  artifacts:
    paths:
      - dist/*.rpm
  only:
    - tags
  allow_failure: true

# Optional: Build APK packages for Alpine Linux
package-apk-nfpm:
  stage: package
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git make
    - go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}
  script:
    - export VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
    - GOOS=linux GOARCH=amd64 make build
    - nfpm package --packager apk --target dist/debian-composer-${VERSION}-x86_64.apk
  artifacts:
    paths:
      - dist/*.apk
  only:
    - tags
  allow_failure: true

# Lintian check for Debian policy compliance
lintian-check:
  stage: package
  image: debian:${DEBIAN_VERSION}
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends -qq lintian
  script:
    - ls dist/*.deb || (echo "No .deb packages found. Run package-deb-nfpm first."; exit 1)
    - echo "=== Running Lintian ==="
    - lintian dist/debian-composer_*.deb --fail-on warning,error --show-overrides || true
    - lintian dist/debian-composer_*.deb --info --show-overrides | head -50 || true
  artifacts:
    paths:
      - dist/*.deb
  only:
    - tags
  allow_failure: true
  needs:
    - package-deb-nfpm

build-docker-image:
  stage: package
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY 2>/dev/null || true
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - tags
    - main
  allow_failure: true

# ============================================================================
# DEPLOY STAGE (manual)
# ============================================================================

release:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        echo "Not a tagged release, skipping..."
        exit 0
      fi
    - echo "Release $CI_COMMIT_TAG created"
    # Upload artifacts to release if needed
  only:
    - tags
  when: manual
  allow_failure: true

# ============================================================================
# PERFORMANCE (optional)
# ============================================================================

benchmark:
  stage: build
  image: golang:${GO_VERSION}-alpine
  script:
    - go test -bench=. -benchmem ./internal/... | tee benchmark.txt
  artifacts:
    paths:
      - benchmark.txt
  only:
    - main
  allow_failure: true
